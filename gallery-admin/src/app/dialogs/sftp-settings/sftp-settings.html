
<h2 class="form-title mat-title-large">FTP Configuration</h2>

<form
  [formGroup]="form"
  class="form-container"
>
  <mat-form-field appearance="outline" class="full-width">
    <mat-label>Username</mat-label>
    <input matInput formControlName="username">
    <mat-error>
      Username is required
    </mat-error>
  </mat-form-field>

  <mat-form-field appearance="outline" class="full-width">
    <mat-label>Password</mat-label>
    <input matInput formControlName="password">
    <mat-error>
      Password is required
    </mat-error>
  </mat-form-field>

  <mat-form-field appearance="outline" class="full-width">
    <mat-label>Server Name</mat-label>
    <input matInput formControlName="server">
    <mat-error>
      Server Name is required
    </mat-error>
  </mat-form-field>

  <mat-form-field appearance="outline" class="full-width">
    <mat-label>Remote Directory</mat-label>
    <input matInput formControlName="remoteDirectory">
    <mat-error>
      Remote Directory Is A Required Field
    </mat-error>
  </mat-form-field>

  <button
    mat-raised-button
    color="primary"
    type="button"
    (click)="saveSettings()"
    [disabled]="form.invalid || !credentialsValidated">
    Save
  </button>

  <button
    mat-raised-button
    color="primary"
    type="button"
    (click)="testSettings()"
    [disabled]="form.invalid">
    Test
  </button>
</form>
