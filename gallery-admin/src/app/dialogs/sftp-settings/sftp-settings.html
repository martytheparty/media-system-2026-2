
<h2 class="form-title mat-title-large">FTP Configuration</h2>

<form [formGroup]="form" (ngSubmit)="onSubmit()" class="form-container">
    <mat-form-field appearance="outline" class="full-width">
    <mat-label>Username</mat-label>
    <input matInput formControlName="username">
    <mat-error>
      Username is required
    </mat-error>
    </mat-form-field>
    
    <mat-form-field appearance="outline" class="full-width">
    <mat-label>Password</mat-label>
    <input matInput formControlName="password">
    <mat-error>
      Password is required
    </mat-error>
  </mat-form-field>

  <mat-form-field appearance="outline" class="full-width">
    <mat-label>Remote Directory</mat-label>
    <input matInput formControlName="remoteDirectory">
    <mat-error>
      Remote Directory Is A Required Field
    </mat-error>
  </mat-form-field>

  <button
    mat-raised-button
    color="primary"
    type="submit"
    [disabled]="form.invalid">
    Save
  </button>

  <button
    mat-raised-button
    color="primary"
    type="submit"
    [disabled]="form.invalid">
    Test
  </button>
</form>
